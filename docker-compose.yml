services:
  sc-datapack:
    build:
      # Clones latest code from the docker branch on every build — no local repo needed
      context: https://github.com/saladin1980/sc_datapack.git#docker
      dockerfile: Dockerfile
    container_name: sc-datapack
    restart: unless-stopped

    volumes:
      # Single folder mount — drop Data.p4k here, JSON output appears in DATA_DIR/JSON/
      - ${DATA_DIR:-./sc-data}:/data

    environment:
      SC_P4K_PATH:    /data/Data.p4k
      SC_OUTPUT_DIR:  /work/extraction
      SC_REPORTS_DIR: /data
      SC_LOGS_DIR:    /data/logs

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
